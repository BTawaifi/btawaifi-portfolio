<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="600" fill="#1b2430">Manual image moderation system: how a report is handled</text>
  <text x="30" y="58" font-size="13" fill="#5b6675">Moderators review incoming image reports; the result is sent to the reporting system through a callback URL.</text>

  <rect x="30" y="170" width="150" height="80" rx="8" fill="#fff8ec" stroke="#8a4b00" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="105" y="203" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2430">Reporting system</text>
  <text x="105" y="225" text-anchor="middle" font-size="12" fill="#5b6675">sends image reports</text>

  <rect x="260" y="150" width="200" height="120" rx="8" fill="#e8eef7" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="360" y="186" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2430">Back end</text>
  <text x="360" y="208" text-anchor="middle" font-size="12" fill="#5b6675">Node.js, Express, TypeORM</text>
  <text x="360" y="228" text-anchor="middle" font-size="12" fill="#5b6675">queues reports, stores</text>
  <text x="360" y="244" text-anchor="middle" font-size="12" fill="#5b6675">results, sends callbacks</text>

  <rect x="260" y="330" width="200" height="64" rx="8" fill="#f3f6fa" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="360" y="358" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2430">MySQL</text>
  <text x="360" y="378" text-anchor="middle" font-size="12" fill="#5b6675">reports and moderation results</text>

  <rect x="260" y="86" width="200" height="40" rx="8" fill="#f3f6fa" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="360" y="111" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">File server (images)</text>

  <rect x="560" y="86" width="190" height="64" rx="8" fill="#f3f6fa" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="655" y="114" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2430">Pre-filter</text>
  <text x="655" y="134" text-anchor="middle" font-size="12" fill="#5b6675">third-party image analysis API</text>

  <rect x="560" y="190" width="190" height="64" rx="8" fill="#e8eef7" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="655" y="218" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2430">Moderator app</text>
  <text x="655" y="238" text-anchor="middle" font-size="12" fill="#5b6675">React, TypeScript</text>

  <rect x="560" y="294" width="190" height="64" rx="8" fill="#fff8ec" stroke="#8a4b00" stroke-width="1.5"/>
  <text x="655" y="322" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2430">Callback URL</text>
  <text x="655" y="342" text-anchor="middle" font-size="12" fill="#5b6675">receives the result</text>

  <rect x="800" y="294" width="130" height="64" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="865" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#1b2430">No callback?</text>
  <text x="865" y="342" text-anchor="middle" font-size="12" fill="#5b6675">transaction rolls back</text>

  <g stroke="#1f3a5f" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <line x1="180" y1="210" x2="258" y2="210"/>
    <line x1="360" y1="126" x2="360" y2="148"/>
    <line x1="460" y1="170" x2="558" y2="125"/>
    <line x1="558" y1="222" x2="462" y2="222"/>
    <line x1="460" y1="250" x2="558" y2="318"/>
    <line x1="360" y1="270" x2="360" y2="328"/>
    <line x1="750" y1="326" x2="798" y2="326"/>
  </g>
  <g font-size="11" fill="#5b6675">
    <text x="196" y="202">report</text>
    <text x="500" y="136">prefilter</text>
    <text x="474" y="216">review</text>
    <text x="494" y="296">result</text>
  </g>
  <text x="30" y="422" font-size="12" fill="#5b6675">Everything runs in Docker Compose. Diagram drawn from the project README.</text>
</svg>
