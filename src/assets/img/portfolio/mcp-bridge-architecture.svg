<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="600" fill="#1b2430">Codebase MCP Bridge: architecture</text>
  <text x="30" y="58" font-size="13" fill="#5b6675">Capabilities and facts for the model; the server enforces every limit and risk rule.</text>

  <g font-size="12" font-weight="600" fill="#5b6675" letter-spacing="1">
    <text x="30" y="92">CLIENTS</text>
    <text x="270" y="92">TRANSPORT</text>
    <text x="510" y="92">TOOL LAYER</text>
    <text x="750" y="92">SERVICES</text>
  </g>

  <!-- Clients -->
  <g fill="#f3f6fa" stroke="#1f3a5f" stroke-width="1.5">
    <rect x="30" y="105" width="190" height="72" rx="8"/>
    <rect x="30" y="200" width="190" height="72" rx="8"/>
  </g>
  <g fill="#1b2430" font-size="14" font-weight="600">
    <text x="125" y="135" text-anchor="middle">Local agents</text>
    <text x="125" y="156" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675">Claude, Codex, Cursor</text>
    <text x="125" y="230" text-anchor="middle">Remote clients</text>
    <text x="125" y="251" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675">ChatGPT connector</text>
  </g>

  <!-- Transport -->
  <g fill="#f3f6fa" stroke="#1f3a5f" stroke-width="1.5">
    <rect x="270" y="105" width="190" height="72" rx="8"/>
    <rect x="270" y="200" width="190" height="72" rx="8"/>
  </g>
  <g fill="#1b2430" font-size="14" font-weight="600">
    <text x="365" y="135" text-anchor="middle">stdio</text>
    <text x="365" y="156" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675">src/stdio.ts</text>
    <text x="365" y="230" text-anchor="middle">Streamable HTTP + OAuth</text>
    <text x="365" y="251" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675">src/server.ts (Express)</text>
  </g>

  <!-- Tool layer -->
  <rect x="510" y="105" width="190" height="200" rx="8" fill="#e8eef7" stroke="#1f3a5f" stroke-width="1.5"/>
  <g fill="#1b2430">
    <text x="605" y="135" text-anchor="middle" font-size="14" font-weight="600">createBridgeServer.ts</text>
    <text x="605" y="156" text-anchor="middle" font-size="12" fill="#5b6675">16 tools, input schemas,</text>
    <text x="605" y="172" text-anchor="middle" font-size="12" fill="#5b6675">per-call limits</text>
    <text x="525" y="200" font-size="12">workspace.*  code.*</text>
    <text x="525" y="218" font-size="12">code.patch, write, delete,</text>
    <text x="525" y="234" font-size="12">rollback</text>
    <text x="525" y="252" font-size="12">git.*  validation.run</text>
    <text x="525" y="268" font-size="12" fill="#8a4b00">command.run (opt-in)</text>
  </g>

  <!-- Services -->
  <g fill="#f3f6fa" stroke="#1f3a5f" stroke-width="1.5">
    <rect x="750" y="105" width="190" height="44" rx="6"/>
    <rect x="750" y="157" width="190" height="44" rx="6"/>
    <rect x="750" y="209" width="190" height="44" rx="6"/>
    <rect x="750" y="261" width="190" height="44" rx="6"/>
    <rect x="750" y="313" width="190" height="44" rx="6"/>
    <rect x="750" y="365" width="190" height="44" rx="6"/>
  </g>
  <g fill="#1b2430" font-size="13">
    <text x="765" y="132">repo: search, read</text>
    <text x="765" y="184">indexer: symbol cache</text>
    <text x="765" y="236">patches: diff + rollback</text>
    <text x="765" y="288">git: status, diff, commit</text>
    <text x="765" y="340">policy + security rules</text>
    <text x="765" y="392">workspaces + OAuth</text>
  </g>

  <!-- Operator -->
  <rect x="30" y="330" width="190" height="72" rx="8" fill="#fff8ec" stroke="#8a4b00" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="125" y="360" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2430">Operator CLI</text>
  <text x="125" y="381" text-anchor="middle" font-size="12" fill="#5b6675">workspace-cli.ts: trust</text>

  <!-- Disk -->
  <rect x="270" y="440" width="670" height="80" rx="8" fill="#f3f6fa" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="290" y="470" font-size="14" font-weight="600" fill="#1b2430">Repository on disk</text>
  <text x="290" y="492" font-size="12" fill="#5b6675">Files read and patched in place. .ai-bridge/ holds rollback snapshots, the optional audit log (metadata only) and OAuth state.</text>

  <!-- Arrows: clients -> transport -->
  <g stroke="#1f3a5f" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <line x1="220" y1="141" x2="268" y2="141"/>
    <line x1="220" y1="236" x2="268" y2="236"/>
    <!-- transport -> tools -->
    <line x1="460" y1="141" x2="508" y2="170"/>
    <line x1="460" y1="236" x2="508" y2="210"/>
    <!-- tools -> services -->
    <line x1="700" y1="127" x2="748" y2="127"/>
    <line x1="700" y1="179" x2="748" y2="179"/>
    <line x1="700" y1="231" x2="748" y2="231"/>
    <line x1="700" y1="250" x2="748" y2="283"/>
    <line x1="700" y1="250" x2="748" y2="335"/>
    <line x1="700" y1="250" x2="748" y2="387"/>
  </g>
  <!-- services -> disk, operator -> workspaces -->
  <g stroke="#1f3a5f" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <line x1="845" y1="409" x2="845" y2="438"/>
    <line x1="220" y1="366" x2="748" y2="400" stroke-dasharray="5 4" stroke="#8a4b00"/>
  </g>
  <text x="520" y="405" font-size="11" fill="#8a4b00" text-anchor="middle">trust is granted out of band; the model can only list</text>
</svg>
