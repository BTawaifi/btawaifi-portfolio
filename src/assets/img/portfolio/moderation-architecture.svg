<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="600" fill="#1b2430">Image moderation: how an upload is classified</text>
  <text x="30" y="58" font-size="13" fill="#5b6675">Services talk over RabbitMQ; Python workers run the CLIP model and report results back.</text>

  <!-- Client and gateway -->
  <rect x="30" y="233" width="120" height="64" rx="8" fill="#fff8ec" stroke="#8a4b00" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="90" y="262" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2430">Client</text>
  <text x="90" y="282" text-anchor="middle" font-size="12" fill="#5b6675">image + token</text>

  <rect x="190" y="233" width="120" height="64" rx="8" fill="#f3f6fa" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="250" y="262" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2430">Gateway</text>
  <text x="250" y="282" text-anchor="middle" font-size="12" fill="#5b6675">routes requests</text>

  <!-- Services -->
  <rect x="360" y="100" width="170" height="64" rx="8" fill="#f3f6fa" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="445" y="129" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2430">Auth service</text>
  <text x="445" y="149" text-anchor="middle" font-size="12" fill="#5b6675">login, verify token</text>

  <rect x="360" y="233" width="170" height="64" rx="8" fill="#f3f6fa" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="445" y="262" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2430">Upload service</text>
  <text x="445" y="282" text-anchor="middle" font-size="12" fill="#5b6675">stores image, queues task</text>

  <rect x="360" y="330" width="170" height="64" rx="8" fill="#f3f6fa" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="445" y="359" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2430">File storage service</text>
  <text x="445" y="379" text-anchor="middle" font-size="12" fill="#5b6675">images by location</text>

  <rect x="360" y="430" width="170" height="64" rx="8" fill="#f3f6fa" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="445" y="459" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2430">Result service</text>
  <text x="445" y="479" text-anchor="middle" font-size="12" fill="#5b6675">cache, reads on a miss</text>

  <!-- Queue -->
  <rect x="580" y="150" width="90" height="250" rx="8" fill="#fff8ec" stroke="#8a4b00" stroke-width="1.5"/>
  <text x="625" y="262" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2430">RabbitMQ</text>
  <text x="625" y="282" text-anchor="middle" font-size="12" fill="#5b6675">task and</text>
  <text x="625" y="298" text-anchor="middle" font-size="12" fill="#5b6675">result</text>
  <text x="625" y="314" text-anchor="middle" font-size="12" fill="#5b6675">queues</text>

  <!-- Worker and database service -->
  <rect x="740" y="160" width="190" height="80" rx="8" fill="#e8eef7" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="835" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2430">CLIP worker</text>
  <text x="835" y="210" text-anchor="middle" font-size="12" fill="#5b6675">Python, FastAPI</text>
  <text x="835" y="226" text-anchor="middle" font-size="12" fill="#5b6675">reads image, classifies it</text>

  <rect x="740" y="310" width="190" height="64" rx="8" fill="#f3f6fa" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="835" y="339" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2430">Database service</text>
  <text x="835" y="359" text-anchor="middle" font-size="12" fill="#5b6675">saves results</text>

  <!-- Arrows -->
  <g stroke="#1f3a5f" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <line x1="150" y1="265" x2="188" y2="265"/>
    <line x1="335" y1="132" x2="358" y2="132"/>
    <line x1="335" y1="265" x2="358" y2="265"/>
    <line x1="335" y1="362" x2="358" y2="362"/>
    <line x1="335" y1="462" x2="358" y2="462"/>
    <line x1="445" y1="297" x2="445" y2="328"/>
    <line x1="530" y1="265" x2="578" y2="265"/>
    <line x1="670" y1="185" x2="738" y2="185"/>
    <line x1="738" y1="215" x2="672" y2="215"/>
    <line x1="670" y1="342" x2="738" y2="342"/>
    <path d="M530 462 H835 V376"/>
  </g>
  <line x1="310" y1="265" x2="335" y2="265" stroke="#1f3a5f" stroke-width="1.6"/>
  <line x1="335" y1="132" x2="335" y2="462" stroke="#1f3a5f" stroke-width="1.6"/>

  <g font-size="11" fill="#5b6675">
    <text x="454" y="316">store image</text>
    <text x="539" y="257">task</text>
    <text x="692" y="177">task</text>
    <text x="692" y="236">result</text>
    <text x="692" y="334">result</text>
    <text x="600" y="454">cache miss: read results</text>
  </g>

  <text x="30" y="522" font-size="12" fill="#5b6675">University project, 2023. Services written with NestJS; classification workers written in Python.</text>
</svg>
